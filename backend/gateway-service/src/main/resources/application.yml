server:
  port: 5054

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:5174"
              - "http://localhost:5175"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-exam-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**,/api/admin/**,/api/attempt-response/**,/api/topic-progress/**,/api/difficulty-stat/**,/api/result/**,/api/exams/*/start,/api/exams/attempt/**,/api/exams/*/submit,/api/exams/*/adaptive/**,/api/batches/**,/api/student/**,/api/exams/violation
        - id: question-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/modules/**,/api/questions/**,/api/difficulty-levels/**,/api/exams/**,/api/topics/**,/api/blueprints/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
